set -g prefix ^a
set -g mouse on

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'

# setw -g mode-keys vi
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind - break-pane -t :

# FZF session/window picker (prefix + s)
bind s display-popup -E -w 60% -h 60% "\
  tmux list-sessions -F '#{session_name}' | \
  fzf --reverse --header='switch session' | \
  xargs -I{} tmux switch-client -t {}"

# Live ripgrep -> nvim popup (prefix + g, for grep); opens in the pane's cwd.
# (f stays as tmux's default find-window.)
bind g display-popup -E -w 90% -h 80% -d '#{pane_current_path}' "~/bin/frg"

set -g status-position top
set -g base-index 1
setw -g pane-base-index 1

set -g @catppuccin_flavour 'mocha'
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W#{?window_zoomed_flag,(🔍),}"
set -g @catppuccin_status_modules_right "" # HUD block at the bottom owns status-right
set -g @catppuccin_status_modules_left "session"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_right_separator_inverse "no"
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_directory_text "#{b:pane_current_path}"

# status-interval is set by the HUD block at the bottom of this file.

run '~/.tmux/plugins/tpm/tpm'

# HUD in the status bar -- the terminal-agnostic twin of the tab-bar status in
# ~/.wezterm.lua, so it also covers Ghostty (no status bar, no scripting API).
# MUST come after tpm, and uses `set -g` (not -ga) because catppuccin builds
# status-right too: this replaces its right block instead of appending to it,
# which is what frees the columns for the clock. The prompt's cwd/git status
# come from p10k, so nothing here needs to repeat them.
set -g status-interval 10
set -g status-right '#[fg=#a6e3a1]#(~/bin/pi-usage --window "#{pane_current_path}" 2>/dev/null)'
set -ga status-right '#[fg=#214969] │#[fg=default] #(~/bin/hud --tmux cpu ram disk clock) '
